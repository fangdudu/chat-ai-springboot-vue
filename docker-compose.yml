version: '3'
services:
  # 前端服务
  chat-ai-vue:
    build:
      context: chat-ai-vue/  # 前端Dockerfile所在目录
      dockerfile: Dockerfile
    container_name: chat-ai-vue-container
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-network  # 关键：共享网络
  # redis
  chat-ai-redis:
    image: redis:7
    container_name: chat-ai-redis-container
    command: redis-server --appendonly yes
    volumes:
      - /mydata/chat-ai-redis/data:/data #数据文件挂载
    networks:
      - app-network  # 关键：共享网络

  # wechat ocr api
  chat-ai-wechat-ocr-api:
    image: golangboyme/wxocr
    container_name: chat-ai-wechat-ocr-api-container
    networks:
      - app-network

  # 后端服务
  chat-ai-springboot:
    build:
      context: chat-ai-springboot  # Dockerfile 所在目录
      dockerfile: Dockerfile
    container_name: chat-ai-springboot-container
    depends_on:
      - chat-ai-redis
    environment:
      - spring.redis.host=chat-ai-redis
      - spring.redis.port=6379
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
